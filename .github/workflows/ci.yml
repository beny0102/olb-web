name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: olb-web

      - uses: actions/checkout@v4
        with:
          repository: beny0102/olb-contract
          path: olb-contract

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            olb-web/package-lock.json
            olb-contract/package-lock.json

      # `file:` dependencies are symlinked, so the contract's own dependencies
      # (ajv, ajv-formats) must be installed for the tests to resolve them.
      - working-directory: olb-contract
        run: npm ci

      - working-directory: olb-web
        run: npm ci

      - working-directory: olb-web
        run: npm run typecheck

      - working-directory: olb-web
        run: npm test

      - working-directory: olb-web
        run: npm run build
